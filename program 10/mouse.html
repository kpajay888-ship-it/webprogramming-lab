<!DOCTYPE html>
<html>
<head>
    <title>mouse Event</title>
</head>

<body style="text-align:center">

    <h2>Mouse Handling</h2>

    <img id="img-tag"
    src="https://img.freepik.com/free-photo/colorful-design-with-spiral-design_188544-9588.jpg"
    onmouseover="changeImg()"
    onmouseout="setOld()"
    width="220px"
    height="230px"
    alt="image"/>

    <script>

        function changeImg() {
            document.getElementById("img-tag").src =
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbdsYw2F887N6XJSogmXlNbV8Nvx8mybBRYD23LfZH7q2bvHApoOaxd0Jm&s=10";
        }

        function setOld() {
            document.getElementById("img-tag").src =
            "https://img.freepik.com/free-photo/colorful-design-with-spiral-design_188544-9588.jpg";
        }

    </script>

</body>
</html>
